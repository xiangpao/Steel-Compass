name: steel-compass

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      STEEL_COMPASS_ENVIRONMENT: production
      STEEL_COMPASS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STEEL_COMPASS_FRONTEND_ORIGIN: ${STEEL_COMPASS_FRONTEND_ORIGIN}
      STEEL_COMPASS_COOKIE_SECURE: ${STEEL_COMPASS_COOKIE_SECURE}
      # Production refuses non-Secure cookies unless the origin is http on loopback.
      STEEL_COMPASS_ALLOW_INSECURE_COOKIE: ${STEEL_COMPASS_ALLOW_INSECURE_COOKIE:-false}
      STEEL_COMPASS_BOOTSTRAP_ADMIN_USERNAME: ${STEEL_COMPASS_BOOTSTRAP_ADMIN_USERNAME}
      STEEL_COMPASS_BOOTSTRAP_ADMIN_PASSWORD: ${STEEL_COMPASS_BOOTSTRAP_ADMIN_PASSWORD}
      STEEL_COMPASS_ANALYSIS_WORKERS: ${STEEL_COMPASS_ANALYSIS_WORKERS:-2}
      # One BLAS thread per worker process avoids oversubscribing the CPUs.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/login",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_SCHEME: ${APP_SCHEME:-http}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "30"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./backups:/backups
      - ./ops/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
